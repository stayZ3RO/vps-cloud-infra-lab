name: Docker Compose Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docker-compose-check:
    name: Validate Docker Compose files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Compose configuration
        run: |
          shopt -s nullglob

          COMPOSE_FILES=(
            docker-compose.yml
            docker-compose.yaml
            compose.yml
            compose.yaml
          )

          FOUND=0

          for file in "${COMPOSE_FILES[@]}"; do
            if [ -f "$file" ]; then
              FOUND=1
              echo "Validating $file"
              docker compose -f "$file" config
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No root-level Compose file found. Skipping Compose validation."
          fi
